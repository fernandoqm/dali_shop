<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <title>Tu pedido · Dali Shop</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="./" aria-label="Dali Shop"><img src="img/logo.webp" alt="Dali Shop" width="44" height="44"><span>Dali Shop</span></a>
      <a class="cart-btn" href="./" style="text-decoration:none">← Seguir comprando</a>
    </div>
  </header>

  <main class="page" id="main">
    <div id="vacio" class="box" hidden>
      <p>Tu carrito está vacío.</p>
      <a class="btn" href="./">Ver catálogo</a>
    </div>

    <form id="form" hidden novalidate>
      <div class="box">
        <h2>Tu pedido</h2>
        <div id="lineas"></div>
        <div class="row" id="rowEnvio" hidden><span>Envío</span><span id="costoEnvio"></span></div>
        <div class="row" style="font-weight:700;font-size:18px"><span>Total</span><span id="total"></span></div>
      </div>

      <div class="box">
        <h2>¿Cómo lo quieres?</h2>
        <div class="opts">
          <label class="opt"><input type="radio" name="tipo" value="recoger" checked>Paso a recoger</label>
          <label class="opt"><input type="radio" name="tipo" value="envio">Enviar a mi dirección</label>
        </div>
      </div>

      <div class="box">
        <h2>Tus datos</h2>
        <label class="f">Nombre<input name="nombre" autocomplete="name" required maxlength="80"></label>
        <label class="f">Teléfono<input name="telefono" type="tel" autocomplete="tel" required maxlength="25"></label>
        <label class="f" id="lblDir" hidden>Dirección de entrega<textarea name="direccion" rows="3" maxlength="300"></textarea></label>
        <label class="f">Notas (opcional)<textarea name="notas" rows="2" maxlength="300"></textarea></label>
      </div>

      <div class="msg" id="error" hidden></div>
      <button class="btn" id="btnEnviar" type="submit">Confirmar pedido</button>
    </form>

    <div id="exito" class="box ok-box" hidden>
      <h2>¡Pedido recibido!</h2>
      <p>Tu número de pedido es</p>
      <div class="code" id="codigo"></div>
      <p id="textoExito"></p>
      <a class="btn wa" id="btnWa" href="#" target="_blank" rel="noopener" hidden>Enviar mi pedido por WhatsApp</a>
      <a class="btn sec" href="./" style="margin-top:10px">Volver al catálogo</a>
    </div>
  </main>

  <footer class="foot" id="footer" hidden></footer>

  <script type="module" src="js/checkout.js"></script>
</body>
</html>
