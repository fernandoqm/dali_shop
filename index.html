<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <title>Dali Shop</title>
  <meta name="description" content="Artículos para el hogar">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="./" aria-label="Dali Shop"><img src="img/logo.webp" alt="Dali Shop" width="44" height="44"><span>Dali Shop</span></a>
      <button class="cart-btn cart-icon" id="btnCart" aria-label="Abrir carrito" title="Carrito">
        <img src="img/carrito.webp" alt="" width="54" height="54">
        <span class="n" id="cartN">0</span>
      </button>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>

  <main class="wrap">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Categorías"></nav>
    <section class="grid" id="grid"></section>
    <p class="vacio" id="vacio">Cargando…</p>
  </main>

  <a class="wa-flot" id="waFlot" href="#" target="_blank" rel="noopener" hidden aria-label="Escribir por WhatsApp">WhatsApp</a>

  <div class="overlay" id="overlay" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="Carrito">
    <header><span>Tu carrito</span><button class="x" id="btnClose" aria-label="Cerrar">&times;</button></header>
    <div class="body" id="cartBody"></div>
    <footer>
      <div class="total"><span>Subtotal</span><span id="cartTotal"></span></div>
      <a class="btn" id="btnPedido" href="pedido.html">Hacer pedido</a>
      <a class="btn wa" id="btnWaCart" href="#" target="_blank" rel="noopener" hidden style="margin-top:10px">Consultar por WhatsApp</a>
    </footer>
  </aside>

  <footer class="foot" id="footer" hidden></footer>

  <script type="module" src="js/catalog.js"></script>
</body>
</html>
